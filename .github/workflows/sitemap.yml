name: Generate Sitemap

on:
  push:
    branches:
      - main # замените на master, если ваша основная ветка называется так
  workflow_dispatch: # позволяет запускать генерацию вручную

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # нужно для определения дат последних изменений страниц

      - name: Generate Sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: 'https://vilyam2430.github.io/hydroponics-calculator/' # или ваш личный домен

      - name: Commit and push Sitemap
        run: |
          if [[ `git status --porcelain sitemap.xml` ]]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add sitemap.xml
            git commit -m "Auto-generate sitemap.xml"
            git push
          fi
